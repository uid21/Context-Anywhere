name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix worker ci
      - run: npm run check
      - name: Verify tag matches manifest
        shell: bash
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_REF_NAME" != "$manifest_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi
      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
