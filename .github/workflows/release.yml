name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Native checkout avoids running a third-party bundle before our patched
      # runtime is available. Credentials exist only in this fetch environment.
      - name: Check out triggering commit
        shell: pwsh
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:CHECKOUT_TOKEN"))
          Write-Output "::add-mask::$auth"
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = "http.$env:GITHUB_SERVER_URL/.extraheader"
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $auth"
          try { git -c protocol.version=2 fetch --no-tags --depth=1 origin $env:GITHUB_SHA }
          finally { Remove-Item Env:GIT_CONFIG_COUNT, Env:GIT_CONFIG_KEY_0, Env:GIT_CONFIG_VALUE_0, Env:CHECKOUT_TOKEN }
          git checkout --detach FETCH_HEAD
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout does not match triggering commit' }
      - name: Install checksum-verified Node
        shell: pwsh
        run: ./.github/ci/bootstrap.ps1
      - name: Install release services
        run: npm --prefix .github/ci ci --ignore-scripts
      - name: Verify release services runtime
        run: npm --prefix .github/ci run verify
      - name: Test release services
        run: npm --prefix .github/ci test
      - run: npm ci
      - run: npm --prefix worker ci
      - run: npm run check
      - name: Verify tag matches manifest
        shell: bash
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_REF_NAME" != "$manifest_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi
      - name: Generate build provenance
        uses: ./.github/ci
        with:
          operation: attest
      - name: Publish plugin release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/ci/release.mjs plugin
